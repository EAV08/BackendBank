# Integración continua del Sprint 2.
# En cada push y en cada pull request hay tres jobs encadenados:
# CI corre JUnit y genera el informe de JaCoCo, Análisis Sonar lo publica
# en SonarCloud y Cobertura JaCoCo deja ese informe como artefacto propio.
# No despliega la aplicación.
# Las pruebas usan H2 en memoria (src/test/resources/application.properties),
# así que CI no necesita PostgreSQL. Sonar sí necesita el secret SONAR_TOKEN.

name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # El pom declara Java 17. Temurin es la distribución y cache: maven
      # reutiliza ~/.m2 entre ejecuciones para no bajar dependencias cada vez.
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # El repo se trabaja desde Windows, donde Git no marca mvnw como ejecutable.
      # En el runner de Ubuntu hay que dar ese permiso antes de llamarlo.
      - name: Permiso de ejecución del wrapper
        run: chmod +x mvnw

      # verify incluye test. El agente de JaCoCo mide mientras corren las pruebas
      # y el goal report, ligado a la fase test, escribe target/site/jacoco.
      - name: Compilar y probar
        run: ./mvnw -B verify

      # if: always() sube los reportes también cuando alguna prueba falla.
      # Los dos directorios comparten target como raíz del artefacto, así que
      # al descargarlo en target quedan site/jacoco/jacoco.xml y surefire-reports.
      - name: Guardar evidencia de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-ci
          if-no-files-found: error
          path: |
            target/surefire-reports
            target/site/jacoco

  sonar:
    name: Análisis Sonar
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 trae el historial completo. SonarCloud lo usa para
      # detectar el código nuevo y atribuir las líneas.
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Recuperar el informe de JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: reportes-ci
          path: target

      - name: Permiso de ejecución del wrapper
        run: chmod +x mvnw

      # -DskipTests evita repetir JUnit. El XML de cobertura ya está en
      # target/site/jacoco/jacoco.xml, que es la ruta declarada en el pom.
      # SONAR_TOKEN autentica contra SonarCloud.
      - name: Publicar el análisis en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests

  jacoco:
    name: Cobertura JaCoCo
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar el informe de JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: reportes-ci
          path: target

      - name: Comprobar que el informe se generó
        run: test -f target/site/jacoco/jacoco.xml && test -f target/site/jacoco/index.html

      - name: Publicar el informe de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
